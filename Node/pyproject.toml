[project]
name = "echinus-node"
version = "0.2.0"
description = "Echinus field node — camera motion detection over LoRa (Raspberry Pi Zero 2W)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "echinus-link",
]

# picamera2 is deliberately not listed: on Pi OS it comes from apt and can't be
# installed from PyPI. The deploy script builds the venv with
# --system-site-packages so the apt copy is importable.

[project.scripts]
echinus-node = "echinus_node.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echinus_node"]

[tool.uv.sources]
echinus-link = { workspace = true }
