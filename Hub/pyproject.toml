[project]
name = "echinus-hub"
version = "0.2.0"
description = "Echinus hub — relays LoRa node traffic to the Server over a websocket (Raspberry Pi 4)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "echinus-link",
]

[project.scripts]
echinus-hub = "echinus_hub.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echinus_hub"]

[tool.uv.sources]
echinus-link = { workspace = true }
